name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Prepare artifact name (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp target/release/FerrisNES artifacts/FerrisNES-linux

      - name: Prepare artifact name (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir artifacts
          copy target\release\FerrisNES.exe artifacts\FerrisNES-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrisnes-${{ matrix.os }}
          path: artifacts/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate tag
        id: tag
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
